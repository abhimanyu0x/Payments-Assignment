components:
  schemas:
    Customer:
      properties:
        created_at:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
    ErrorDetails:
      properties:
        code:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/InvalidField"
        message:
          type: string
        request_id:
          type: string
    ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetails"
    Event:
      properties:
        created_at:
          type: string
          format: date-time
        event_type:
          type: string
          enum:
          - invoice.created
          - invoice.paid
          - invoice.payment_failed
        id:
          type: string
          format: uuid
        payload:
          type: object
    InvalidField:
      properties:
        field:
          type: string
        message:
          type: string
    Invoice:
      properties:
        allowed_actions:
          type: array
          items:
            type: string
        amount_display:
          type: string
        created_at:
          type: string
          format: date-time
        currency:
          type: string
        customer_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
        paid_at:
          type: string
          format: date-time
        payment_block_reason:
          type: string
          enum:
          - invoice_already_paid
          - payment_in_progress
        state:
          type: string
          enum:
          - open
          - paid
        total_amount_cents:
          type: integer
          format: int64
    InvoiceInput:
      properties:
        customer_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
          maxItems: 100
          minItems: 1
      required:
      - customer_id
      - due_date
      - items
    InvoiceItem:
      properties:
        description:
          type: string
        quantity:
          type: integer
          format: int32
        unit_amount_cents:
          type: integer
          format: int64
