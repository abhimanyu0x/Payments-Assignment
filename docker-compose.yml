x-demo: &demo
  DEMO_MODE: "true"
  DEMO_WEBHOOK_URL: http://demo-receiver:8090/webhooks
  DEMO_WEBHOOK_SECRET: &demo-webhook-secret ${DEMO_WEBHOOK_SECRET:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
services:
  db:
    image: postgres:18.6-alpine
    ports: [ "127.0.0.1:${DB_PORT:-5432}:5432" ]
    environment:
      POSTGRES_DB: dodo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_database_only}
    volumes:
      - database:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U postgres -d dodo" ]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: { context: ., target: app }
    environment:
      <<: *demo
      DATABASE_URL: jdbc:postgresql://db:5432/dodo
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local_database_only}
      MIGRATE: "true"
      LIQUIBASE_CONTEXTS: demo
      WORKERS_ENABLED: "false"
      ACCESS_LOG_ENABLED: "false"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      db: { condition: service_healthy }
  app:
    build: { context: ., target: app }
    ports: [ "127.0.0.1:${APP_PORT:-8080}:8080" ]
    environment:
      <<: *demo
      DATABASE_URL: jdbc:postgresql://db:5432/dodo
      PSP_URL: http://mock-psp:8081
      WEBHOOK_TRUSTED_HOSTS: demo-receiver
    depends_on:
      migrate: { condition: service_completed_successfully }
      mock-psp: { condition: service_healthy }
    healthcheck:
      test: [ CMD-SHELL, "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  mock-psp:
    build: { context: ., target: mock-psp }
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/dodo
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [ CMD-SHELL, "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  demo-receiver:
    build: { context: ., target: webhook-receiver }
    ports: [ "127.0.0.1:${RECEIVER_PORT:-8090}:8090" ]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/dodo
      WEBHOOK_SECRET: *demo-webhook-secret
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [ CMD-SHELL, "curl -fsS http://127.0.0.1:8090/actuator/health | grep -q UP" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  frontend:
    profiles: [ ui ]
    build: ./frontend
    ports: [ "127.0.0.1:${UI_PORT:-3000}:80" ]
    depends_on:
      app: { condition: service_healthy }
  tests:
    profiles: [ tests ]
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: [ mvn, -B, clean, test ]
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
  e2e:
    profiles: [ e2e ]
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: [ mvn, -B, -pl, app, -am, -Pe2e, test ]
    environment:
      API_URL: http://app:8080/api/v1
      RECEIVER_URL: http://demo-receiver:8090
      PSP_URL: http://mock-psp:8081
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    depends_on:
      app: { condition: service_healthy }
      demo-receiver: { condition: service_healthy }
volumes:
  database:
  maven-cache:
