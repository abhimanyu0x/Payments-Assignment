server {
 listen 80;
 server_name _;
 server_tokens off;
 root /usr/share/nginx/html;
 set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
 location / {
  try_files $uri /index.html;
  add_header Cache-Control "no-cache" always;
  add_header Content-Security-Policy $csp always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
 }
 location /assets/ {
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
 }
 location /api/ {
  proxy_pass http://app:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  client_max_body_size 64k;
 }
}
